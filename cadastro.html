<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastro | EcoReserve</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="auth-page">


    <header class="header">

        <div class="logo">
            EcoReserve
        </div>

        <nav>

            <a href="index.html">
                Início
            </a>

            <a href="login.html"
               class="button-small">
                Entrar
            </a>

        </nav>

    </header>


    <main class="auth-container">


        <div class="auth-card">


            <div class="auth-header">

                <span class="tag">
                    ECORRESERVE
                </span>

                <h1>
                    Crie sua conta
                </h1>

                <p>
                    Cadastre-se para começar a explorar
                    nossas experiências.
                </p>

            </div>


            <form id="registerForm">


                <div class="form-group">

                    <label for="name">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Seu nome completo"
                    >

                    <span
                        id="nameError"
                        class="error-message">
                    </span>

                </div>


                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seu@email.com"
                    >

                    <span
                        id="emailError"
                        class="error-message">
                    </span>

                </div>


                <div class="form-group">

                    <label for="password">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Mínimo de 6 caracteres"
                    >

                    <span
                        id="passwordError"
                        class="error-message">
                    </span>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Digite a senha novamente"
                    >

                    <span
                        id="confirmPasswordError"
                        class="error-message">
                    </span>

                </div>


                <button
                    type="submit"
                    class="button-primary full-width"
                    data-testid="register-submit">

                    Criar conta

                </button>


                <div
                    id="registerMessage"
                    class="message">
                </div>


            </form>


            <div class="auth-footer">

                <p>
                    Já possui uma conta?
                </p>

                <a href="login.html">
                    Entrar
                </a>

            </div>


        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
