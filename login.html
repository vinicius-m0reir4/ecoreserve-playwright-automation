<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | EcoReserve</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="auth-page">


    <header class="header">

        <div class="logo">
            EcoReserve
        </div>

        <nav>

            <a href="index.html">
                Início
            </a>

            <a href="cadastro.html"
               class="button-small">
                Criar conta
            </a>

        </nav>

    </header>


    <main class="auth-container">


        <div class="auth-card">


            <div class="auth-header">

                <span class="tag">
                    BEM-VINDO DE VOLTA
                </span>

                <h1>
                    Entrar na sua conta
                </h1>

                <p>
                    Acesse sua conta para continuar.
                </p>

            </div>


            <form id="loginForm">


                <div class="form-group">

                    <label for="loginEmail">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="seu@email.com"
                    >

                    <span
                        id="loginEmailError"
                        class="error-message">
                    </span>

                </div>


                <div class="form-group">

                    <label for="loginPassword">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Digite sua senha"
                    >

                    <span
                        id="loginPasswordError"
                        class="error-message">
                    </span>

                </div>


                <button
                    type="submit"
                    class="button-primary full-width"
                    data-testid="login-submit">

                    Entrar

                </button>


                <div
                    id="loginMessage"
                    class="message">
                </div>


            </form>


            <div class="auth-footer">

                <p>
                    Ainda não possui uma conta?
                </p>

                <a href="cadastro.html">
                    Criar uma conta
                </a>

            </div>


        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
